
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GeneGlass | Analysis Details</title>

  <link rel="stylesheet" href="../DashboardPage/dashboard.css">
<link rel="stylesheet" href="../AnalysisPage/analysis.css">
<link rel="stylesheet" href="details.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

 
<script src="../assets/config.js" defer></script>
<script src="../assets/auth.js" defer></script>
<script src="../assets/chromatogram-viewer.js" defer></script>
<script src="details.js" defer></script>

</head>

<body>
  <div class="dashboard-page">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img
          class="sidebar-logo"
          src="../assets/geneglass-logo.png"
          alt="GeneGlass"
        >
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <a class="nav-item" href="../DashboardPage/dashboard.html">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>

        <a class="nav-item" href="../AnalysisPage/analysis.html">
          <i class="fa-solid fa-dna"></i>
          <span>New Analysis</span>
        </a>

        <a class="nav-item active" href="../HistoryPage/history.html">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>History</span>
        </a>

        <a class="nav-item" href="../ProfilePage/profile.html">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </a>
      </nav>

      <img
        class="sidebar-dna"
        src="../assets/dna-bg.png"
        alt=""
        aria-hidden="true"
      >
    </aside>

    <!-- Main content -->
    <main class="main-content">

      <img
        class="dashboard-dna"
        src="../assets/dna-bg.png"
        alt=""
        aria-hidden="true"
      >

      <header class="dashboard-header">
        <div>
          <h1>Analysis Details</h1>
          <p>Review your saved sequencing analysis.</p>
        </div>

        <a class="new-analysis-button"
          href="../HistoryPage/history.html">
          <i class="fa-solid fa-arrow-left"></i>
          Back to History
        </a>
      </header>

      <!-- File information -->
      <section class="dashboard-card details-card">
        <h2>File Information</h2>
        <div id="fileDetails" class="details-grid">
          <p>Loading file information...</p>
        </div>
      </section>

      <!-- Chromatogram -->
      <section class="dashboard-card details-card">
        <h2>Chromatogram Viewer</h2>
      
<div id="detailsChromatogram">
  <div id="chromatogramSection" hidden>
    <div class="chromatogram-chart">
      <canvas
        id="chromatogramCanvas"
        width="1100"
        height="320"
      ></canvas>
    </div>

    <input id="chromStart" type="number" hidden>
    <input id="chromCount" type="number" hidden>

    <p id="chromatogramDetail"></p>
  </div>

  <p id="chromatogramLoading">
    Loading chromatogram...
  </p>
</div>

      </section>

      <!-- JAK2 analysis -->
      <section class="dashboard-card details-card">
        <h2>JAK2 V617F Target Analysis</h2>
        <div id="jak2Details" class="details-grid">
          <p>Loading JAK2 results...</p>
        </div>
      </section>

      <p id="detailsMessage" role="status"></p>

    </main>
  </div>
</body>
</html>
