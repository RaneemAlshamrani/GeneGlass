<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GeneGlass | Dashboard</title>
<link href="dashboard.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>

<script defer="" src="../assets/config.js"></script>
<script defer="" src="../assets/auth.js"></script>
</head>
<body>
<div class="dashboard-page">
<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">
<div class="sidebar-brand">
<img alt="GeneGlass" class="sidebar-logo" src="../assets/geneglass-logo.png"/>
</div>
<nav class="sidebar-nav">
<a class="nav-item active" href="dashboard.html">
<i class="fa-solid fa-house"></i>
<span>Dashboard</span>
</a>
<a class="nav-item" href="../AnalysisPage/analysis.html">
<i class="fa-solid fa-dna"></i>
<span>New Analysis</span>
</a>
<a class="nav-item" href="../HistoryPage/history.html">
<i class="fa-solid fa-clock-rotate-left"></i>
<span>History</span>
</a>
<a class="nav-item" href="../ProfilePage/profile.html">
<i class="fa-solid fa-user"></i>
<span>Profile</span>
</a>
</nav>
<!-- Decorative DNA -->
<img alt="" class="sidebar-dna" src="../assets/dna-bg.png"/>
</aside>
<!-- ================= MAIN ================= -->
<main class="main-content">
<img alt="" class="dashboard-dna" src="../assets/dna-bg.png"/>
<!-- ================= HEADER ================= -->

<header class="dashboard-header">
  <div>
    <h1>Welcome back</h1>
  </div>
</header>

<!-- ================= STAT CARDS ================= -->
<section class="stats-grid">

  <!-- Total Analyses -->
  <article class="stat-card gg-summary-card">
    <div class="stat-icon">
      <i class="fa-solid fa-flask-vial"></i>
    </div>
    <div class="stat-info">
      <p>Total Analyses</p>
      <h2 id="ggTotal">—</h2>
    </div>
  </article>

  <!-- Heterozygous -->
  <article class="stat-card gg-summary-card">
    <div class="stat-icon">
      <i class="fa-solid fa-dna"></i>
    </div>
    <div class="stat-info">
      <p>Heterozygous</p>
      <h2 id="ggPositive">—</h2>
    </div>
  </article>

  <!-- Not Detected -->
  <article class="stat-card gg-summary-card">
    <div class="stat-icon">
      <i class="fa-solid fa-circle-minus"></i>
    </div>
    <div class="stat-info">
      <p>Not Detected</p>
      <h2 id="ggNegative">—</h2>
    </div>
  </article>

</section>
<!-- ================= RECENT ACTIVITY ================= -->
<section class="dashboard-card recent-card">
<div class="recent-header">
<div>
<h2>Recent Activity</h2>
<p>Your latest sequencing analyses</p>
</div>
<a class="new-analysis-button" href="../AnalysisPage/analysis.html">
<i class="fa-solid fa-plus"></i>
<span>Start New Analysis</span>
<span class="button-arrow">→</span>
</a>
</div>
<div class="table-wrapper">
<table>
<thead><tr><th>File Name</th><th>Date</th><th>Result</th></tr></thead>
<tbody><tr><td colspan="3" style="text-align:center;padding:24px">Loading analyses…</td></tr></tbody>
</table>
</div>
</section>
</main>
</div>
<script src="dashboard.js?v=20261112-1"></script>
</body>
</html>
