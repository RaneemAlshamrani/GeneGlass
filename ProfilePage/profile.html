<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeneGlass | Profile</title>
    <link rel="stylesheet" href="../DashboardPage/dashboard.css" />
    <link rel="stylesheet" href="profile.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="../assets/config.js" defer></script>
    <script src="../assets/auth.js" defer></script>
    <script src="profile.js" defer></script>
  </head>

  <body>
    <div class="dashboard-page">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img
            class="sidebar-logo"
            src="../assets/geneglass-logo.png"
            alt="GeneGlass"
          />
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a class="nav-item" href="../DashboardPage/dashboard.html">
            <i class="fa-solid fa-house"></i><span>Dashboard</span>
          </a>
          <a class="nav-item" href="../AnalysisPage/analysis.html">
            <i class="fa-solid fa-dna"></i><span>New Analysis</span>
          </a>
          <a class="nav-item" href="../HistoryPage/history.html">
            <i class="fa-solid fa-clock-rotate-left"></i><span>History</span>
          </a>
          <a class="nav-item active" href="profile.html" aria-current="page">
            <i class="fa-solid fa-user"></i><span>Profile</span>
          </a>
        </nav>

        <img
          class="sidebar-dna"
          src="../assets/dna-bg.png"
          alt=""
          aria-hidden="true"
        />
      </aside>

      <main class="main-content profile-main">
        <img
          class="dashboard-dna"
          src="../assets/dna-bg.png"
          alt=""
          aria-hidden="true"
        />

        <header class="profile-heading">
          <div>
            <h1>My Profile</h1>

          </div>
          <button id="logoutBtn" class="outline-btn" type="button">
            <i class="fa-solid fa-right-from-bracket"></i> Log Out
          </button>
        </header>

        <section
          class="profile-card identity-card"
          aria-label="Specialist overview"
        >
          <div class="avatar">
            <i class="fa-solid fa-user-doctor"></i>
          </div>
          <div class="identity">
            <h2 id="displayName" data-auth-name>Specialist</h2>
            <p>Laboratory Specialist</p>
            <span class="profile-chip">
              <i class="fa-solid fa-flask"></i>  Specialist
            </span>
          </div>
        </section>

        <div class="profile-grid">
          <section class="profile-card details-card">
            <div class="section-head">
              <div>
                <h2>Personal Information</h2>

              </div>
              <button type="button" id="editBtn" class="outline-btn">
                <i class="fa-solid fa-pen"></i> Edit Profile
              </button>
            </div>

            <form id="profileForm" novalidate>
              <div class="fields-grid">
                <label>
                  Full Name
                  <input
                    id="fullName"
                    type="text"
                    value="Specialist"
                    data-auth-name
                    maxlength="80"
                    disabled
                    required
                  />
                </label>

                <label>
                  Email Address
                  <input
                    id="email"
                    type="email"
                    data-auth-email
                    placeholder="Not provided"
                    maxlength="120"
                    disabled
                  />
                </label>

                <label>
                  Role
                  <input value="Laboratory Specialist" disabled />
                </label>

                <label>
                  Department
                  <input
                    id="department"
                    type="text"
                    value="Not provided"
                    data-auth-department
                    maxlength="100"
                    disabled
                  />
                </label>
              </div>

              <div id="editActions" class="edit-actions" hidden>
                <button type="submit" class="primary-btn">Save Changes</button>
                <button type="button" id="cancelBtn" class="outline-btn">
                  Cancel
                </button>
              </div>

              <p id="profileMessage" class="form-message" role="status"></p>
            </form>
          </section>

          <section class="profile-card stats-card">
            <div class="section-head">
              <div>
                <h2>My Analysis Statistics</h2>

              </div>
            </div>

            <div class="stat-row">
              <div class="stat-icon">
                <i class="fa-solid fa-file-waveform"></i>
              </div>
              <div>
                <span>Total Analyses</span>
                <strong id="totalCount">—</strong>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-icon">
                <i class="fa-solid fa-circle-check"></i>
              </div>
              <div>
                <span>Completed Analyses</span>
                <strong id="completedCount">—</strong>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-icon">
                <i class="fa-solid fa-magnifying-glass-chart"></i>
              </div>
              <div>
                <span>Needs Review</span>
                <strong id="reviewCount">—</strong>
              </div>
            </div>

            <p
              id="statisticsMessage"
              class="muted-note"
              role="status"
              aria-live="polite"
            >
              Loading your analysis statistics...
            </p>
          </section>
        </div>

        <section class="profile-card password-card">
          <details class="password-toggle">
            <summary class="password-toggle-heading">
              <span class="password-toggle-copy">
                <strong><i class="fa-solid fa-lock" aria-hidden="true"></i> Change Password</strong>
              </span>
              <span class="password-toggle-chevron" aria-hidden="true">
                <i class="fa-solid fa-chevron-down"></i>
              </span>
            </summary>
            <div class="password-toggle-content">
              <form id="changePasswordForm" class="password-form">
                <div class="password-form-grid">
                  <label for="currentPassword">
                    Current Password
                    <input id="currentPassword" name="currentPassword" type="password"
                      autocomplete="current-password" required />
                  </label>
                  <label for="newPassword">
                    New Password
                    <input id="newPassword" name="newPassword" type="password"
                      minlength="12" maxlength="128" autocomplete="new-password" required />
                  </label>
                  <label for="confirmPassword">
                    Confirm New Password
                    <input id="confirmPassword" name="confirmPassword" type="password"
                      minlength="12" maxlength="128" autocomplete="new-password" required />
                  </label>
                </div>
                <div class="password-form-footer">
                  <p id="passwordMessage" class="form-message" role="status" aria-live="polite"></p>
                  <button type="submit" class="primary-btn" id="changePasswordBtn">
                    <i class="fa-solid fa-check" aria-hidden="true"></i> Save Changes
                  </button>
                </div>
              </form>
            </div>
          </details>
        </section>

      </main>
    </div>
  </body>
</html>
